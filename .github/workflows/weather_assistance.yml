name: Daily Weather Assistant

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd Weather-Morning-assistance
          pip install -r requirements.txt

      - name: Run Weather Assistant
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASS }}
        run: |
          cd Weather-Morning-assistance
          ls
          python main_sendEmail.py
